<p>您可以随时在游戏内「设置」中撤回对本政策的同意。撤回后游戏将无法继续运行，但不影响撤回前基于您的同意已完成的处理活动。</p>

<p>本游戏不设账号体系，不存在注册账号，因此也不存在需要注销的账号。</p>
<h3 class="sub">（六）响应您的请求</h3>
<p>如您就个人信息保护提出查阅、更正、删除或撤回同意等请求，可通过本政策第十章所列渠道与我们联系。为保障安全，我们可能先要求您提供必要信息以验证身份，再处理您的请求。我们将在<strong>十五个工作日</strong>内答复。</p>

<h2 class="ch" id="c8"><span class="n">八</span>我们如何处理未成年人的个人信息</h2>
<p>（一）我们高度重视未成年人个人信息保护。根据《中华人民共和国个人信息保护法》第三十一条，处理不满十四周岁未成年人个人信息应当取得其父母或者其他监护人的同意，并制定专门的个人信息处理规则（儿童个人信息处理规则）。<strong>由于本游戏不收集任何个人信息，我们不处理未成年人的个人信息，因此无需单独制定儿童个人信息处理规则。</strong></p>
<p>（二）本游戏不含社交、聊天、付费、抽奖、广告等模块，也不含任何用户生成内容或公开分享功能，未成年人在游戏内无法向他人传递或公开任何信息。</p>
<p>（三）<strong>关于游戏时长。</strong>如您通过 TapTap 平台启动本游戏，未成年人的游戏时段与时长将依据国家新闻出版署《关于防止未成年人沉迷网络游戏的通知》的相关要求，由平台侧统一限制。</p>
<p>（四）<strong>监护人提示。</strong>如您是未成年人的监护人，建议您关注被监护人的游戏时长与内容，引导其合理安排时间。如您对被监护人的个人信息处理有任何疑问，可通过本政策第十章所列渠道与我们联系。</p>

<h2 class="ch" id="c9"><span class="n">九</span>本隐私政策如何更新</h2>
<p>（一）我们可能适时修订本政策。修订后的版本将在本页面发布，并同步更新顶部的「更新日期」。</p>
<p>（二）对于<strong>重大变更</strong>，我们会以显著方式（例如游戏内弹窗提示）在变更生效前通知您，并在必要时重新取得您的同意。重大变更包括但不限于：</p>
<ul>
  <li>开始收集或使用此前未收集的个人信息；</li>
  <li>新增联网功能、账号体系或云服务；</li>
  <li>新增第三方 SDK，或第三方共享对象发生变化；</li>
  <li>您行使个人信息权利的方式发生重大变化；</li>
  <li>运营主体、联系方式或投诉渠道发生变更。</li>
</ul>
<p>（三）未经您明确同意，我们不会削减您依据本政策所应享有的权利。</p>
<p>（四）本政策的历史版本可向我们索取。</p>

<h2 class="ch" id="c10"><span class="n">十</span>如何联系我们</h2>
<p>如您对本政策或个人信息保护有任何问题、意见或建议，可以通过以下渠道与我们联系：</p>
<div class="tw">
<table>
  <tbody>
    <tr><th>运营主体</th><td>鹏达游戏开发工作室</td></tr>
    <tr><th>联系渠道</th><td>TapTap 游戏详情页 →「联系开发者」入口</td></tr>
    <tr><th>电子邮箱</th><td><em>（待填写）</em></td></tr>
    <tr><th>响应时限</th><td>收到请求后十五个工作日内答复</td></tr>
  </tbody>
</table>
</div>
<p>一般情况下，我们将在十五个工作日内回复。如果您对我们的回复不满意，特别是认为我们的个人信息处理行为损害了您的合法权益，您还可以向网信、电信、公安、市场监管等主管部门投诉举报，或向被告住所地有管辖权的人民法院提起诉讼来寻求解决方案。</p>

<div class="update">
  <b>关于本页面的用途</b><br>
  本页面同时作为本游戏在应用商店（含 TapTap）商品页「隐私政策链接」字段所指向的公开地址。若本游戏的信息处理方式发生任何变化，本页面会同步更新「更新日期」与正文内容。
</div>

P.en = {
  h1:'Privacy Policy',
  meta:'Last updated: 2 November 2026',
  meta2:'Effective: 2 November 2026',
  body:`
<div class="note">
  <h3>A short version first</h3>
  <ol>
    <li>Welcome to The Small Sound Archive. We take your privacy seriously — please read this policy in full.</li>
    <li>The game is a <strong>fully offline, single-player title</strong>. It makes no network requests and collects no personal information about you.</li>
    <li>To let you resume where you left off, the game writes a <strong>small amount of data</strong> to your device's local storage (progress, unlocked notes, language). This never leaves your device.</li>
    <li>The game requests no sensitive permissions — no camera, microphone, contacts, location, SMS or photo library — and includes no analytics, advertising or push services.</li>
    <li>When launched through the TapTap client, <strong>real-name verification and minor-protection checks are handled by the TapTap platform</strong>. We receive only the verification result, never your name or ID number.</li>
    <li>You can clear your local save at any time in-game, or delete everything by uninstalling the app.</li>
    <li>If you are a minor, please read this policy with your parent or guardian and use the game only with their consent.</li>
  </ol>
</div>

<p><strong>Pengda Game Development Studio</strong> (鹏达游戏开发工作室, "we", "us") develops and operates The Small Sound Archive (the "Game"). We process personal information strictly in accordance with this policy.</p>
<p>This policy covers only the information handling involved in providing the Game to you. It does not cover information processing carried out independently by third-party platforms such as TapTap when you use their services.</p>

<div class="toc">
  <h3>What this policy covers</h3>
  <ol>
    <li><a href="#c1">How we collect and use your personal information</a></li>
    <li><a href="#c2">How we store your personal information</a></li>
    <li><a href="#c3">How we use cookies and similar technologies</a></li>
    <li><a href="#c4">How we share, transfer or publicly disclose your information</a></li>
    <li><a href="#c5">How third-party products or services obtain your information</a></li>
    <li><a href="#c6">How we protect your personal information</a></li>
    <li><a href="#c7">How you manage your personal information</a></li>
    <li><a href="#c8">How we handle minors' personal information</a></li>
    <li><a href="#c9">How this policy is updated</a></li>
    <li><a href="#c10">How to contact us</a></li>
  </ol>
</div>

<h2 class="ch" id="c1"><span class="n">1</span>How we collect and use your personal information</h2>

<h3 class="sub">(a) The Game itself collects no personal information</h3>
<p>The Game is a fully offline program; all content ships inside the installer. While running it <strong>makes no network requests</strong>, requires no registration or login, and does not read your phone number, contacts, SMS, location, photo library, microphone or camera. It contains no analytics, advertising, push, social-sharing or profiling services.</p>
<p>This is a deliberate design choice: every sound is synthesised at runtime with the Web Audio API, so there are no audio files to download and no reason to go online. Nothing is collected, so nothing can be misused.</p>

<h3 class="sub">(b) Data stored locally on your device</h3>
<p>So that you can resume where you left off, the Game writes the following to your device's local storage (LocalStorage). <strong>This data stays on your device.</strong> We cannot access it, do not upload it and do not share it with anyone.</p>
<div class="tw">
<table>
  <thead><tr><th>Key</th><th>Content</th><th>Purpose</th></tr></thead>
  <tbody>
    <tr><td><code>ssa_save</code></td><td>Chapter progress, sound layers on the desk, skills learned</td><td>Resume an unfinished chapter</td></tr>
    <tr><td><code>ssa_notes</code></td><td>Sound notes you have unlocked</td><td>Reread collected entries in the Archive</td></tr>
    <tr><td><code>ssa_lang</code></td><td>中文 / English</td><td>Remember your language choice</td></tr>
    <tr><td><code>ssa_tour_done</code></td><td>Whether the tutorial has been seen</td><td>Avoid repeating the tutorial</td></tr>
    <tr><td><code>ssa_consent</code></td><td>Your acknowledgement of this policy</td><td>Avoid showing the consent sheet again</td></tr>
  </tbody>
</table>
</div>
<p class="tblnote">This data is terminal-local storage and does not constitute collection of personal information. Uninstalling the app, or clearing its data in system settings, deletes all of it permanently.</p>

<h3 class="sub">(c) Real-name verification and minor protection via TapTap</h3>
<p>Under applicable Chinese regulations on preventing minors from becoming addicted to online games, players must complete real-name verification. When you download and launch the Game through the TapTap client, <strong>real-name verification, age verification and play-time management are carried out by the TapTap platform (Yiwan (Shanghai) Network Technology Co., Ltd.) under its own privacy policy</strong>.</p>
<p>We receive only the result — whether the account has passed verification and its age bracket — in order to determine whether minor play-time restrictions apply. <strong>We do not obtain, store or transmit your name, ID document type, ID number or facial image.</strong></p>

<h3 class="sub">(d) No other uses</h3>
<p>We do not use any of the above for advertising, profiling, targeted marketing, or sell, rent or otherwise provide it to third parties.</p>

<h3 class="sub">(e) Cases not requiring consent</h3>
<p>Under Article 13 of China's Personal Information Protection Law, we may process personal information without consent where: it is necessary to perform statutory duties or obligations; it is necessary to respond to a public health emergency or to protect a natural person's life, health or property in an emergency; the information has been lawfully made public by you or is otherwise lawfully public and is processed within a reasonable scope; or other circumstances provided by laws and administrative regulations.</p>

<h2 class="ch" id="c2"><span class="n">2</span>How we store your personal information</h2>
<p>(a) <strong>Location.</strong> The Game transmits no personal information to any server, so there is no cross-border transfer and no offshore storage. The local data described above resides on your device.</p>
<p>(b) <strong>Retention.</strong> Local data persists until you delete it (in-game reset, clearing app data, or uninstalling). We keep no server-side copy, so there is no remote data to erase when a retention period ends.</p>
<p>(c) <strong>Principle of minimal necessity.</strong> If a future version adds an online feature (cloud saves, leaderboards), we will update this policy and fulfil notice-and-consent obligations before enabling it.</p>
<p>(d) <strong>Cross-border transfer.</strong> The Game conducts no outbound transfer of personal information.</p>

<h2 class="ch" id="c3"><span class="n">3</span>How we use cookies and similar technologies</h2>
<p>The Game <strong>uses no cookies, Flash cookies, pixel tags, device fingerprinting or any similar tracking technology</strong>.</p>
<p>Its LocalStorage is used solely for the data listed in section 1(b). It contains no device identifiers, advertising IDs or cross-site tracking data, and is not shared with any third party.</p>
<p>If you play the web version in a browser, clearing site data in your browser settings has the same effect as clearing your save.</p>

<h2 class="ch" id="c4"><span class="n">4</span>How we share, transfer or publicly disclose your information</h2>
<h3 class="sub">(a) Sharing</h3>
<p>We do not share your personal information with any third party. Since the Game collects none, no sharing takes place.</p>
<h3 class="sub">(b) Entrusted processing</h3>
<p>We do not entrust any third party with processing your personal information.</p>
<h3 class="sub">(c) Transfer</h3>
<p>We do not transfer your personal information to any company, organisation or individual. Should a merger, acquisition, asset transfer or liquidation involving personal information occur, we will inform you and require the successor to remain bound by this policy, or otherwise obtain your consent afresh.</p>
<h3 class="sub">(d) Public disclosure</h3>
<p>We do not publicly disclose your personal information.</p>
<h3 class="sub">(e) Exceptions</h3>
<p>We may provide necessary information where required by laws and regulations or by mandatory requests from competent government authorities or judicial bodies following due legal process. We review the lawfulness of any such request carefully.</p>

<h2 class="ch" id="c5"><span class="n">5</span>How third-party products or services obtain your information</h2>
<h3 class="sub">(a) No third-party SDK in the Game itself</h3>
<p>All sound is synthesised live with the Web Audio API and no remote resources are loaded. The package contains no advertising, analytics, push, social-sharing or payment SDK.</p>
<h3 class="sub">(b) TapTap platform services</h3>
<p>When you obtain or launch the Game through the TapTap client, the client may process your account and device information under its own privacy policy. That processing is determined independently by TapTap; we neither control it nor bear responsibility for it.</p>
<div class="tw">
<table>
  <thead><tr><th>Service</th><th>Provider</th><th>Purpose</th><th>Information processed</th><th>Policy</th></tr></thead>
  <tbody>
    <tr>
      <td>TapTap client<br>TapSDK compliance</td>
      <td>Yiwan (Shanghai) Network Technology Co., Ltd.</td>
      <td>Distribution, real-name verification, minor-protection checks</td>
      <td>Account identifier, device identifiers, network status, verification and age-bracket result</td>
      <td><a href="https://www.taptap.cn/privacy-policy" target="_blank" rel="noopener">taptap.cn/privacy-policy</a></td>
    </tr>
  </tbody>
</table>
</div>
<p class="tblnote">For details of a third-party SDK's data practices, please refer to the privacy policy or statement published by its operator.</p>

<h2 class="ch" id="c6"><span class="n">6</span>How we protect your personal information</h2>
<p>(a) Because the Game collects and uploads nothing, it structurally avoids the risks of exposure during network transmission and server storage. <strong>Data that does not exist cannot leak.</strong> This is the most thorough protection we can offer.</p>
<p>(b) Local data is protected by your device's own security model (the app sandbox); other apps cannot read this game's storage directory.</p>
<p>(c) If a future version introduces any feature that collects information, we will apply industry-standard technical and organisational safeguards such as encrypted transmission, access control and least privilege, and will notify you promptly under law should a security incident occur.</p>
<p>(d) Please look after your device. If someone else has physical access to it, your local save may be readable. If you share a device, consider clearing app data after playing.</p>

<h2 class="ch" id="c7"><span class="n">7</span>How you manage your personal information</h2>
<h3 class="sub">(a) Access</h3>
<p>The in-game Archive shows every sound note you have unlocked; Settings shows your current language and chapter progress.</p>
<h3 class="sub">(b) Correction</h3>
<p>To reset progress or change language, restart from Settings or switch the language directly.</p>
<h3 class="sub">(c) Deletion</h3>
<p>You may delete all local data by any of the following. Deletion is irreversible:</p>
<ol>
  <li>In-game Settings → "Clear local save";</li>
  <li>System settings → Apps → The Small Sound Archive → Storage → Clear data;</li>
  <li>Uninstalling the Game.</li>
</ol>
<h3 class="sub">(d) Withdrawing consent</h3>
<p>You may withdraw your acknowledgement of this policy at any time in Settings. The Game will then no longer run, but processing carried out before withdrawal on the basis of your consent is unaffected.</p>
<h3 class="sub">(e) Account cancellation</h3>
<p>The Game has no account system, so there is no account to cancel.</p>
<h3 class="sub">(f) Responding to requests</h3>
<p>For access, correction, deletion or withdrawal requests, contact us via the channel in section 10. To protect your security we may first ask you to verify your identity. We respond within <strong>fifteen working days</strong>.</p>

<h2 class="ch" id="c8"><span class="n">8</span>How we handle minors' personal information</h2>
<p>(a) We take the protection of minors' personal information seriously. Under Article 31 of China's Personal Information Protection Law, processing the personal information of a minor under 14 requires the consent of a parent or other guardian and separate rules for children's personal information. <strong>Because the Game collects no personal information, it processes no minors' personal information and therefore requires no separate children's rules.</strong></p>
<p>(b) The Game contains no social, chat, payment, loot-box or advertising features, and no user-generated or public-sharing functions, so minors cannot transmit or publish any information to others in-game.</p>
<p>(c) <strong>Play time.</strong> When launched through TapTap, minors' play sessions and durations are restricted on the platform side in line with the Chinese authorities' notice on preventing minors from becoming addicted to online games.</p>
<p>(d) <strong>For guardians.</strong> We encourage guardians to pay attention to the play time and content of minors in their care. If you have questions about how a minor's information is handled, contact us via section 10.</p>

<h2 class="ch" id="c9"><span class="n">9</span>How this policy is updated</h2>
<p>(a) We may revise this policy from time to time. Revised versions are published on this page with an updated "Last updated" date.</p>
<p>(b) For <strong>material changes</strong> we will give prominent notice (for example an in-game dialog) before they take effect, and will seek your consent again where required. Material changes include, but are not limited to:</p>
<ul>
  <li>collecting or using personal information not previously collected;</li>
  <li>adding online features, an account system or cloud services;</li>
  <li>adding a third-party SDK, or changing third-party recipients;</li>
  <li>a material change in how you exercise your rights;</li>
  <li>a change of operator, contact details or complaint channel.</li>
</ul>
<p>(c) We will not reduce your rights under this policy without your explicit consent.</p>
<p>(d) Previous versions are available on request.</p>

<h2 class="ch" id="c10"><span class="n">10</span>How to contact us</h2>
<p>For any question, comment or suggestion about this policy or personal information protection:</p>
<div class="tw">
<table>
  <tbody>
    <tr><th>Operator</th><td>Pengda Game Development Studio (鹏达游戏开发工作室)</td></tr>
    <tr><th>Channel</th><td>TapTap store page → "Contact developer"</td></tr>
    <tr><th>Email</th><td><em>(to be completed)</em></td></tr>
    <tr><th>Response</th><td>Within fifteen working days</td></tr>
  </tbody>
</table>
</div>
<p>If you are not satisfied with our response, particularly where our handling of personal information has harmed your lawful rights, you may complain to the competent authorities for cyberspace, telecommunications, public security or market regulation, or bring the matter before the competent people's court at the defendant's domicile.</p>

<div class="update">
  <b>About this page</b><br>
  This page also serves as the public address referenced by the "Privacy Policy URL" field on the Game's store listings, including TapTap. If how the Game handles information ever changes, the date and content here are updated together.
</div>

let LANG = 'zh';
function render(){
  const d = P[LANG];
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
  document.title = (LANG==='zh'?'小声音档案馆 · ':'The Small Sound Archive · ') + d.h1;
  document.getElementById('h1').textContent = d.h1;
  document.getElementById('meta').textContent = d.meta;
  document.getElementById('meta2').textContent = d.meta2;
  document.getElementById('body').innerHTML = d.body;
  document.getElementById('foot').innerHTML = d.foot;
  document.querySelectorAll('.langs button').forEach(b=>{
    b.classList.toggle('on', b.dataset.lang===LANG);
  });
  window.scrollTo(0,0);
  try{ history.replaceState(null,'', LANG==='zh'?'?lang=zh':'?lang=en'); }catch(e){}
}
document.querySelectorAll('.langs button').forEach(b=>{
  b.addEventListener('click',()=>{ LANG=b.dataset.lang; render(); });
});
const q = new URLSearchParams(location.search).get('lang');
if(q==='en'||q==='zh') LANG = q;
else if((navigator.language||'').toLowerCase().indexOf('zh') !== 0) LANG = 'en';
render();
</script>
</body>
</html>
